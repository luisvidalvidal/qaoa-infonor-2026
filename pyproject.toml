[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "qaoa-infonor-2026"
version = "1.0.0"
description = "Reproducible statevector QAOA and regional input-output proof of concept"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scipy==1.17.0"]
[tool.setuptools.packages.find]
where = ["src"]
